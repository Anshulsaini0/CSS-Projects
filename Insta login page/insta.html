<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="gram.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1 class="logo">Instagram</h1>

            <div class="input-group">
                <input type="text" class="input" placeholder="Phone number, username or email address">
            </div>

            <div class="input-group password-group">
                <input type="password" class="input" placeholder="Password">
                <i class="fa-solid fa-eye-slash eye-icon"></i>
                <p class="forgot">Forgotten password?</p>
            </div>

            <div class="login-btn-group">
                <button class="login-btn">Log in</button>
                <div class="divider">
                    <span class="line"></span>
                    <span class="or">OR</span>
                    <span class="line"></span>
                </div>
                <div class="facebook-login">
                    <i class="fab fa-facebook-square"></i>
                    <span>Log in with Facebook</span>
                </div>
            </div>
            <footer class="footer">
                <p>Don't have an account? <span class="signup">Sign Up</span></p>
            </footer>
        </div>
    </div>
</body>
</html>
