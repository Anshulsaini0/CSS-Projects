<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link href="https://fonts.googleapis.com/css2?family=Product+Sans&family=Roboto:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="Googly">
    <nav class="Navbar">
        <div class="arrow-left"><i class="fa-solid fa-left-long"></i></div>
        <div class="arrow-right"><i class="fa-solid fa-right-long"></i></div>
        <div class="refresh"><i class="fa-solid fa-rotate-right"></i></div>
        <div class="fullSearchbar">
            <div class="googlelogo"><i class="fa-brands fa-google"></i></div>
             <input type="text" class="searchbar" placeholder="Search Google or type a URL"></div>
            <div class="star"><i class="fa-solid fa-star"></i></div>
        </div>
        <div class="icon"><i class="fa-solid fa-puzzle-piece"></i></div>
        <div class="line">|</div>
        <div class="mailicon"><i class="fa-solid fa-circle-user"></i></div>
        <div class="control"><i class="fa-solid fa-ellipsis-vertical"></i></div>
    </nav>

    <section class="main">
        <h1 class="heading">G<span class="o">o</span><span class="o2">o</span><span class="g">g</span><span class="l">l</span><span class="e">e</span></h1><br>
        <div class="centerSearch">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" class="search" placeholder="Search Google or type a URL">
          <i class="fa-solid fa-microphone mic-icon"></i>
          <i class="fa-solid fa-camera camera-icon"></i>
        </div><br>
        <div class="buttons">
            <button class="gbtn">Google Search</button>
            <button class="gbtn">I'm Feeling Lucky</button>
        </div><br>
    </section>
</body>
</html>
